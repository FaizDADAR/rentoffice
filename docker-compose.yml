services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentoffice_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    networks:
      - rentoffice
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: mysql:8
    container_name: rentoffice_db
    restart: always
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=rentoffice
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rentoffice

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rentoffice_phpmyadmin
    depends_on:
      - db
    environment:
      - PMA_HOST=db
      - PMA_ARBITRARY=1
    ports:
      - "8081:80"
    networks:
      - rentoffice

networks:
  rentoffice:
    driver: bridge

volumes:
  db_data:
